<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#FF5A2F" />
    <title>같이타 - 오프라인</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 24px;
        background: #f7f8fa;
        color: #191f28;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
      }
      p {
        margin: 0;
        font-size: 14px;
        color: #4e5968;
      }
      button {
        margin-top: 16px;
        padding: 12px 24px;
        border: 0;
        border-radius: 8px;
        background: #ff5a2f;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <h1>인터넷에 연결되어 있지 않아요</h1>
    <p>네트워크 상태를 확인한 뒤 다시 시도해 주세요.</p>
    <button type="button" onclick="location.reload()">다시 시도</button>
  </body>
</html>
